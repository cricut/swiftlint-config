name: Close Stale PRs

on:
  schedule:
    - cron: "30 15 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log what would happen without labeling or closing"
        required: false
        type: boolean
        default: true

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    uses: cricut/actions/.github/workflows/stale-prs.yml@main
    with:
      dry-run: ${{ inputs.dry_run == true }}
      exempt-draft-pr: false
